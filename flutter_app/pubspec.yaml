name: beta_app

description: Flutter migration base for OmniStudio.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  http: ^1.0.0
  provider: ^6.1.2
  path_provider: 2.1.4
  share_plus: 10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mime: ^1.0.6
  video_player: ^2.9.2
  geolocator: ^13.0.2
  maplibre_gl: ^0.20.0
  flutter_tts: ^4.2.3
  google_sign_in: ^7.2.0

  # Keep these until feature migration is complete
  shared_preferences: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
