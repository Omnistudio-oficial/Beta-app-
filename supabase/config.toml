# The function validates Firebase ID tokens itself. Supabase's gateway must not
# try to validate the Firebase token as a Supabase JWT.
[functions.delete-chat-media]
verify_jwt = false

# This endpoint validates the Firebase ID token itself.
[functions.notify-chat-message]
verify_jwt = false

# Social pushes also validate the Firebase ID token themselves.
[functions.notify-social-event]
verify_jwt = false

# Private Social media endpoints verify Firebase ID tokens themselves.
[functions.social-media-access]
verify_jwt = false

# This endpoint validates Firebase ID tokens itself.
[functions.chat-media-access]
verify_jwt = false

# Sara Worker push bridge. Requests are authenticated with timestamped HMAC.
[functions.send-sara-task-push]
verify_jwt = false

# Device registration validates Firebase ID tokens in the function itself.
[functions.register-sara-fcm-device]
verify_jwt = false
