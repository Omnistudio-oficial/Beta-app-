name: Flutter PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Generate iOS scaffold with Firebase configuration
        run: |
          flutter create --platforms=android,ios --project-name=omnistudio_flutter_prototype --org=com.omnistudio --no-pub .ci_scaffold
          python3 tool/prepare_platforms.py .ci_scaffold
          rm -rf ios
          cp -R .ci_scaffold/ios ./ios
          rm -rf android
          cp -R .ci_scaffold/android ./android
          rm -rf .ci_scaffold
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter sources
        run: flutter analyze --no-pub
      - name: Run offline-capable widget tests
        run: flutter test --no-pub
      - name: Build unsigned iOS app
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          --dart-define=SUPABASE_PROJECT_URL=$SUPABASE_PROJECT_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=OPENROUTESERVICE_API_KEY=$OPENROUTESERVICE_API_KEY

      - name: Build generated Android host
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=SUPABASE_PROJECT_URL=$SUPABASE_PROJECT_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=OPENROUTESERVICE_API_KEY=$OPENROUTESERVICE_API_KEY
