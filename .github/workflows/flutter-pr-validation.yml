name: Flutter PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
      - name: Generate iOS scaffold with Firebase configuration
        run: |
          flutter create --platforms=android,ios --project-name=omnistudio_flutter_prototype --org=com.omnistudio --no-pub .ci_scaffold
          python3 tool/prepare_platforms.py .ci_scaffold
          rm -rf ios
          cp -R .ci_scaffold/ios ./ios
          rm -rf android
          cp -R .ci_scaffold/android ./android
          rm -rf .ci_scaffold
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file is missing")
          text = gradle.read_text()
          updated, count = re.subn(r"(?m)^(\s*compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|[0-9]+)(\s*(?://.*)?$)", r"\g<1>36\g<2>", text, count=1)
          if count != 1:
              updated, count = re.subn(r"(?m)^(\s*compileSdkVersion\s+)(?:flutter\.compileSdkVersion|[0-9]+)(\s*(?://.*)?$)", r"\g<1>36\g<2>", text, count=1)
          if count != 1:
              raise SystemExit("Could not force generated Android compile SDK to 36")
          gradle.write_text(updated)
          print("Verified generated Android Gradle compileSdk line:")
          print(next(line.strip() for line in updated.splitlines() if "compileSdk" in line))
          PYGRADLE
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Set Android plugin compile SDK to API 36
        run: |
          python3 - <<'PYPLUGIN'
          import json, re
          from pathlib import Path
          metadata = Path(".flutter-plugins-dependencies")
          if not metadata.is_file():
              raise SystemExit("Flutter plugin dependency metadata is missing")
          data = json.loads(metadata.read_text())
          plugins = data.get("plugins", {}).get("android", [])
          if not plugins:
              raise SystemExit("Flutter reports no Android plugins")
          pattern = re.compile(r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*|\s+))(?:flutter\.compileSdkVersion|[0-9]+)(\s*(?://.*)?$)")
          changed = []
          untouched = []
          for plugin in plugins:
              base = Path(plugin["path"])
              for gradle in (base / "android/build.gradle", base / "android/build.gradle.kts"):
                  if not gradle.is_file():
                      continue
                  text = gradle.read_text(errors="ignore")
                  updated, count = pattern.subn(r"\g<1>36\g<2>", text, count=1)
                  if count:
                      gradle.write_text(updated)
                      changed.append((plugin.get("name", base.name), str(gradle)))
                  else:
                      untouched.append((plugin.get("name", base.name), str(gradle)))
          print(f"Flutter Android plugins: {len(plugins)}; patched Gradle files: {len(changed)}")
          for name, path in changed:
              print(f"API 36: {name}: {path}")
          for name, path in untouched:
              print(f"No compileSdk declaration: {name}: {path}")
          if not changed:
              raise SystemExit("Could not find plugin compileSdk declaration to update")
          PYPLUGIN
      - name: Analyze Flutter sources
        run: flutter analyze --no-pub
      - name: Run offline-capable widget tests
        run: flutter test --no-pub
      - name: Build unsigned iOS app
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: >-
          flutter build ios --debug --no-codesign --no-pub
          --dart-define=SUPABASE_PROJECT_URL=$SUPABASE_PROJECT_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=OPENROUTESERVICE_API_KEY=$OPENROUTESERVICE_API_KEY

      - name: Build generated Android host
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=SUPABASE_PROJECT_URL=$SUPABASE_PROJECT_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=OPENROUTESERVICE_API_KEY=$OPENROUTESERVICE_API_KEY
