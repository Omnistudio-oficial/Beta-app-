name: Flutter iOS validation and TestFlight

on:
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ios-testflight.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Build, sign, and upload to TestFlight (default false; explicit confirmation required)"
        required: true
        type: boolean
        default: false
      confirm_testflight_upload:
        description: 'Type I CONFIRM TESTFLIGHT UPLOAD only after a separate explicit approval'
        required: false
        type: string
        default: ''
      signing_test_only:
        description: 'Validate signing and export the IPA, but do not upload to App Store Connect'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Analyze and test Flutter on macOS
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffold with registered Firebase configuration
        run: |
          flutter create --platforms=ios --project-name=omnistudio_flutter_prototype --org=com.omnistudio --no-pub .ci_scaffold
          python3 tool/prepare_platforms.py .ci_scaffold
          rm -rf ios
          cp -R .ci_scaffold/ios ./ios
          rm -rf .ci_scaffold
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter sources
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  upload:
    name: Optional signed upload to TestFlight
    if: ${{ inputs.signing_test_only || (inputs.upload_to_testflight && inputs.confirm_testflight_upload == 'I CONFIRM TESTFLIGHT UPLOAD') }}
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    env:
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - name: Require a second explicit upload confirmation
        if: ${{ !inputs.signing_test_only }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CONFIRMATION: ${{ inputs.confirm_testflight_upload }}
        run: |
          if [[ "$CONFIRMATION" != 'I CONFIRM TESTFLIGHT UPLOAD' ]]; then
            echo 'Upload stopped before secrets or signing are used. Re-run only after explicit approval and type the exact confirmation phrase.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Safe preflight for App Store Connect and signing assets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Upload stopped before signing: required GitHub Actions secrets are missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_dir="${GITHUB_WORKSPACE}/flutter_app/private_keys"
          key_file="${key_dir}/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          if ! openssl pkey -in "$key_file" -noout >/dev/null 2>&1; then
            echo 'Upload stopped: ASC_PRIVATE_KEY is not a parseable private key.' >&2
            exit 1
          fi
      - name: Generate iOS scaffold
        run: |
          flutter create --platforms=ios --project-name=omnistudio_flutter_prototype --org=com.omnistudio --no-pub .ci_scaffold
          python3 tool/prepare_platforms.py .ci_scaffold
          rm -rf ios
          cp -R .ci_scaffold/ios ./ios
          rm -rf .ci_scaffold
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Import and verify distribution signing assets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          # Use a random alphanumeric password; avoid path punctuation in the
          # temporary PKCS#12/keychain password on newer macOS security tools.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          export KEYCHAIN_PASSWORD
          CERT_FILE="${RUNNER_TEMP}/distribution.p12"
          PROFILE_FILE="${RUNNER_TEMP}/profile.mobileprovision"
          KEYCHAIN_FILE="${RUNNER_TEMP}/ios-signing.keychain-db"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_FILE"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          # Normalize the PKCS#12 on the ephemeral runner before Keychain import.
          # This handles valid PKCS#12 cipher variants not accepted by macOS Security.
          PEM_FILE="${RUNNER_TEMP}/distribution-import.pem"
          NORMALIZED_P12="${RUNNER_TEMP}/distribution-normalized.p12"
          if ! openssl pkcs12 -in "$CERT_FILE" -passin env:IOS_CERTIFICATE_PASSWORD -nodes -out "$PEM_FILE" 2>/dev/null; then
            echo 'Upload stopped: could not decrypt distribution P12 with configured password.' >&2
            exit 1
          fi
          chmod 600 "$PEM_FILE"
          if ! openssl pkcs12 -export -legacy -in "$PEM_FILE" -out "$NORMALIZED_P12" -passout env:KEYCHAIN_PASSWORD >/dev/null 2>&1; then
            echo 'Upload stopped: could not normalize decrypted distribution P12.' >&2
            exit 1
          fi
          chmod 600 "$NORMALIZED_P12"
          security import "$NORMALIZED_P12" -k "$KEYCHAIN_FILE" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$PEM_FILE" "$NORMALIZED_P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain-db
          identity_count="$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" 2>/dev/null | grep -c '"Apple Distribution:' || true)"
          if [[ "$identity_count" -lt 1 ]]; then
            echo 'Upload stopped: imported P12 has no usable Apple Distribution identity.' >&2
            exit 1
          fi
          security cms -D -i "$PROFILE_FILE" > "$PROFILE_PLIST"
          PROFILE_ID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          TASKS_ALLOWED="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")"
          if [[ "$APP_ID" == *"*"* || "$APP_ID" != *".com.omnistudio.omnistudioFlutterPrototype" ]]; then
            echo 'Upload stopped: provisioning profile application identifier does not exactly match the Flutter bundle ID.' >&2
            exit 1
          fi
          if [[ "$TASKS_ALLOWED" != "false" ]]; then
            echo 'Upload stopped: provisioning profile is not an App Store distribution profile.' >&2
            exit 1
          fi
          if ! security find-identity -v -p codesigning "$KEYCHAIN_FILE" 2>/dev/null | grep -Fq "($TEAM_ID)"; then
            echo 'Upload stopped: signing identity does not match the profile team.' >&2
            exit 1
          fi
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_FILE" "$PROFILE_DIR/${PROFILE_ID}.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_ID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
      - name: Create manual App Store export options
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': 'app-store-connect',
              'signingStyle': 'manual',
              'teamID': os.environ['TEAM_ID'],
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  'com.omnistudio.omnistudioFlutterPrototype': os.environ['PROFILE_NAME']
              },
              'destination': 'export',
          }
          with open('ios/ExportOptions.plist', 'wb') as f:
              plistlib.dump(options, f)
          PY
      - name: Compile Flutter iOS app without development signing
        run: flutter build ios --release --no-codesign --no-pub
      - name: Archive app with verified App Store distribution signing
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          # Scope distribution signing to the Runner app target only. Passing
          # PROVISIONING_PROFILE_SPECIFIER on the xcodebuild command line
          # overrides every target in the workspace, including Pods and
          # Swift packages that must remain automatically signed.
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = project.read_text()

          def block_for(text, start):
              opening = text.index("{", start)
              depth = 0
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, pos + 1
              raise RuntimeError("Unbalanced Xcode project block")

          target_match = re.search(
              r"(?m)^\s*([A-F0-9]+) /\* Runner \*/ = \{\s*isa = PBXNativeTarget;",
              text,
          )
          if not target_match:
              raise SystemExit("Could not locate the Runner app target")
          _, target_end = block_for(text, target_match.start())
          target = text[target_match.start():target_end]
          list_match = re.search(r"buildConfigurationList = ([A-F0-9]+) /\*", target)
          if not list_match:
              raise SystemExit("Could not locate Runner build configurations")
          list_id = list_match.group(1)
          config_list_match = re.search(
              rf"(?m)^\s*{list_id} /\*[^*]+\*/ = \{{\s*isa = XCConfigurationList;",
              text,
          )
          if not config_list_match:
              raise SystemExit("Could not resolve Runner configuration list")
          _, list_end = block_for(text, config_list_match.start())
          config_list = text[config_list_match.start():list_end]
          configs_match = re.search(r"buildConfigurations = \((.*?)\);", config_list, re.S)
          if not configs_match:
              raise SystemExit("Runner configuration list is empty")
          config_ids = re.findall(r"([A-F0-9]+) /\*", configs_match.group(1))
          if not config_ids:
              raise SystemExit("No Runner build configurations found")
          settings = (
              f"\n\t\t\t\tCODE_SIGN_STYLE = Manual;"
              f"\n\t\t\t\tDEVELOPMENT_TEAM = {os.environ['TEAM_ID']};"
              f"\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {os.environ['PROFILE_UUID']};"
              f"\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";"
              f"\n\t\t\t\tCODE_SIGNING_ALLOWED = YES;"
              f"\n\t\t\t\tCODE_SIGNING_REQUIRED = YES;"
          )
          for config_id in config_ids:
              match = re.search(
                  rf"(?m)^\s*{config_id} /\*[^*]+\*/ = \{{\s*isa = XCBuildConfiguration;",
                  text,
              )
              if not match:
                  raise SystemExit(f"Could not resolve Runner config {config_id}")
              start, end = block_for(text, match.start())
              chunk = text[start:end]
              build_settings = re.search(r"buildSettings = \{", chunk)
              if not build_settings:
                  raise SystemExit(f"Runner config {config_id} lacks build settings")
              insert_at = start + build_settings.end()
              text = text[:insert_at] + settings + text[insert_at:]
          project.write_text(text)
          print(f"Applied manual distribution signing to Runner only ({len(config_ids)} configs).")
          PYTHON
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/OmniStudio.xcarchive" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OmniStudio.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist ios/ExportOptions.plist
          mkdir -p build/ios/ipa
          cp "$RUNNER_TEMP/ipa-export"/*.ipa build/ios/ipa/
      - name: Upload IPA to App Store Connect
        if: ${{ !inputs.signing_test_only }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/ios-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "${RUNNER_TEMP}/distribution.p12" "${RUNNER_TEMP}/profile.mobileprovision" "${RUNNER_TEMP}/profile.plist" "${GITHUB_WORKSPACE}/flutter_app/private_keys/AuthKey_${ASC_KEY_ID}.p8" "${RUNNER_TEMP}/distribution-import.pem" "${RUNNER_TEMP}/distribution-normalized.p12"